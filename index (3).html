<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSC Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1b33;--mut:#5b6780;--line:#e3e8f1;--pri:#1d3b8b;--pri2:#2f5bd8;--ok:#16905d;--warn:#c27a0a;--bad:#c0392b;--track:#e8edf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--card:#141c30;--ink:#e8edf8;--mut:#93a0ba;--line:#243049;--pri:#7ea0ff;--pri2:#5b82f0;--ok:#3ecf8e;--warn:#f0a93b;--bad:#ff7a6b;--track:#222d47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1222;--card:#141c30;--ink:#e8edf8;--mut:#93a0ba;--line:#243049;--pri:#7ea0ff;--pri2:#5b82f0;--ok:#3ecf8e;--warn:#f0a93b;--bad:#ff7a6b;--track:#222d47;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans Bengali",system-ui,sans-serif}
.bn{font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--pri2)}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.login{max-width:400px;margin:9vh auto 0;text-align:center}
.login h1{font-size:22px;margin:14px 0 4px}.login p{color:var(--mut);margin:0 0 18px;font-size:14px}
.login label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text]{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri2);outline-offset:1px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:148px;height:148px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700}
.ring small{display:block;font-size:11px;font-weight:500;color:var(--mut);text-align:center;margin-top:-6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--mut)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sub{cursor:pointer;transition:border-color .15s}.sub:hover{border-color:var(--pri2)}
.sub .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub .t strong{font-size:15px}.sub .t em{font-style:normal;font-weight:700;font-size:15px}
.sub .bn{color:var(--mut);font-size:13px}
.bar{height:7px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--pri2)}
.meta{font-size:12px;color:var(--mut);margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:4px 0 14px}
.tab{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.ch{display:grid;grid-template-columns:30px 1fr auto;gap:10px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.ch:first-child{border-top:0}
.num{width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut)}
.ch.done .num{background:var(--ok);color:#fff}
.ch .name{font-size:14.5px;font-weight:500}
.ch .ctl{grid-column:2/4;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ch .pc{font-weight:700;font-size:14px;min-width:42px;text-align:right}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--ok)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.lb{width:100%;border-collapse:collapse}.lb td,.lb th{padding:11px 8px;border-top:1px solid var(--line);text-align:left;font-size:14px}
.lb th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);border-top:0}
.lb tr.s{cursor:pointer}.lb tr.s:hover{background:var(--bg)}
.rk{font-weight:700;color:var(--pri)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;padding:6px 0 10px}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:28px 0}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--pri2) 12%,var(--bg)),var(--bg) 380px) no-repeat,var(--bg)}
.logo{background:linear-gradient(135deg,#2f5bd8,#8b3fe0 60%,#e0568f)}
.card.hero{background:linear-gradient(135deg,#1d3b8b,#6d3bd8 58%,#e0568f);border:0;color:#fff;box-shadow:0 10px 28px -12px rgba(80,60,200,.55)}
.hero div{color:#fff!important}.hero .stat{background:rgba(255,255,255,.16)}.hero .stat span{color:rgba(255,255,255,.82)!important}
.hero .ring circle:first-child{stroke:rgba(255,255,255,.25)}.hero .ring circle:last-child{stroke:#fff}
.sub{border-top:4px solid var(--ac,var(--pri2))}.sub .t em{color:var(--ac)}
.stars{color:#f5a623;font-size:13px;letter-spacing:1px;margin-left:4px}
.b-top{background:#f5a6232e;color:#b9770e}
.btn.pri{background:linear-gradient(135deg,#2f5bd8,#7a3fe0);border:0}
.ch.done{background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 9%,transparent),transparent)}
.cred{font-size:10.5px;font-weight:400;color:var(--mut);letter-spacing:.2px}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:34px}
.back{border:0;background:none;color:var(--pri2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 2px}
.stats{grid-template-columns:1fr}.hlogo{height:36px;border-radius:8px;display:block}
.cd{margin-top:12px}
.cdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.cdg div{background:var(--bg);border-radius:10px;padding:12px 4px}
.cdg b{display:block;font-size:28px;font-variant-numeric:tabular-nums;color:var(--pri2)}
.cdg span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.rem{font-size:13px;margin-top:12px}
.rt td{padding:6px 8px}.rt select,.rt input{width:100%}
.sheet{background:#fff;color:#111;border-radius:12px;padding:26px;border:1px solid #ddd}
.sheet .sh{display:flex;gap:16px;align-items:center;border-bottom:3px solid #2f5bd8;padding-bottom:12px}.sheet .sh img{height:56px;border-radius:8px}.sheet h1{margin:0;font-size:22px}
.sheet .ss{font-size:13px;margin:12px 0}.sheet table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.sheet th,.sheet td{border:1px solid #bbb;padding:6px 9px;text-align:left;height:28px}.sheet th{background:#eef2fb}.sheet .sf{text-align:center;font-size:10.5px;color:#666;margin-top:14px}
@media print{.top,.noprint,.foot,.toast{display:none!important}body{background:#fff!important}.wrap{padding:0;max-width:none}.sheet{border:0;padding:0}@page{margin:14mm}}
html[lang="bn"] body{font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif}
.tgs{margin-left:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--pri2);color:#fff}
.ibtn{padding:7px 10px;display:inline-grid;place-items:center;line-height:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;margin-right:5px;vertical-align:middle}
.rb{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:11px 12px 11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg);position:relative}
.rb>.dot{position:absolute;left:-1px;top:12px;bottom:12px;width:4px;height:auto;border-radius:0 4px 4px 0;margin:0}
.rb.bad{border-color:var(--bad)}
.rb label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.rb label.grow{flex:1 1 150px}
.rb input[type=time],.rb input[type=text],.rb select{width:100%;padding:8px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400}
.rb input[type=time]{width:124px}
.xbtn{padding:8px 11px;color:var(--bad)}
.sugbox{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--warn) 13%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.warnbox{margin:0 0 10px;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.bar24{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--track);border:1px solid var(--line)}
.bar24 i{display:block;height:100%}
.ticks{position:relative;height:18px;margin:4px 0 12px;font-size:10.5px;color:var(--mut)}
.ticks span{position:absolute;transform:translateX(0);white-space:nowrap}
.gls{margin-top:6px}
.gl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .dot{margin:0}
.gl .gn{color:var(--mut);font-size:13px}
.gl .gt{text-align:right;font-size:13.5px;font-weight:600}
.gl .gt small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.gl.gap{opacity:.7;font-style:italic}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.mbg{position:absolute;inset:0;background:rgba(8,12,24,.55)}
.mbox{position:relative;max-width:380px;width:100%;box-shadow:0 20px 50px -16px rgba(0,0,0,.5)}
.mbox p{margin:0 0 14px}
.sig{display:inline-flex;flex-direction:column;align-items:center;gap:0;color:var(--pri2)}
.sig-by{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut)}
.sig-n{font-family:"Mrs Saint Delafield","Segoe Script","Brush Script MT",cursive;font-size:44px;line-height:1.05;padding:0 10px;background:linear-gradient(135deg,#2f5bd8,#8b3fe0 55%,#e0568f);-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-4deg);display:inline-block}
.sig-sw{width:120px;height:10px;margin-top:-4px;opacity:.85}
.foot{margin-top:30px}
.sheet .sf .sig{color:#2f5bd8}.sheet .sf .sig-by{color:#666}.sheet .sf{text-align:right}
.sheet td .du{font-size:11px;color:#666}.sheet tr.gp td{color:#777;font-style:italic;background:#fafafa}
.sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media(max-width:560px){.rb input[type=time]{width:112px}.seg button{padding:8px 9px}}
@media print{.modal{display:none!important}.sheet tr{break-inside:avoid}}
</style>
</head>

/* ===== routine: time helpers ===== */
const toMin=v=>{const m=/^(\d{1,2}):(\d{2})/.exec(v||'');return m?(+m[1]%24)*60+(+m[2]):null};
const toHHMM=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function fmtT(m){
  m=((m%1440)+1440)%1440;const h24=Math.floor(m/60),mm=m%60,h=h24%12||12;
  if(st.lang==='bn'){
    const per=h24<4?'রাত':h24<6?'ভোর':h24<12?'সকাল':h24<15?'দুপুর':h24<17?'বিকাল':h24<19?'সন্ধ্যা':'রাত';
    return per+' '+bnum(h)+(mm?':'+bnum(String(mm).padStart(2,'0')):'টা');
  }
  return h+(mm?':'+String(mm).padStart(2,'0'):'')+' '+(h24<12?'AM':'PM');
}
function fmtD(min){const h=Math.floor(min/60),m=min%60;
  return h&&m?tr('hm',{h,m}):h?tr('hrs',{h}):tr('mins',{m})}

function defaultRoutine(){
  const b=(s,e,a)=>({s:Math.round(s*60),e:Math.round(e*60)%1440,a,n:''});
  return [b(0,6,'sleep'),b(6,6.5,'prayer'),b(6.5,7,'meal'),b(7,9,'study'),b(9,10,'travel'),b(10,16,'school'),
    b(16,17,'rest'),b(17,18,'exercise'),b(18,18.5,'prayer'),b(18.5,19,'rest'),b(19,22,'study'),b(22,22.5,'meal'),b(22.5,24,'rest')];
}
function migrateOld(r){
  const lab={};ACK.forEach(k=>lab[AC[k].en]=k);const out=[];
  for(let h=0;h<24;h++){const m=r[h]||{},k=lab[m.a];if(!k)continue;const last=out[out.length-1];
    if(last&&last.e===h*60&&last.a===k&&(last.n||'')===(m.n||''))last.e=(h+1)*60%1440;
    else out.push({s:h*60,e:(h+1)*60%1440,a:k,n:m.n||''})}
  return out;
}
const sortRb=()=>st.rb.sort((a,b)=>a.s-b.s||a.e-b.e);

/* Build the merged day layout. Consecutive blocks with the same activity+note are joined,
   even across midnight, and unplanned time is shown as a break. */
function layout(rb){
  const occ=new Array(1440).fill(-1),ovl=new Set();let over=0;
  rb.forEach((b,i)=>{const len=((b.e-b.s)+1440)%1440;
    for(let k=0;k<len;k++){const x=(b.s+k)%1440;if(occ[x]===-1)occ[x]=i;else{over++;ovl.add(i);ovl.add(occ[x])}}});
  const keyOf=x=>occ[x]===-1?'free':rb[occ[x]].a+'|'+(rb[occ[x]].n||'').trim();
  const lin=[];let cur=null;
  for(let x=0;x<1440;x++){const k=keyOf(x);
    if(cur&&cur.key===k)cur.e=x+1;
    else{cur={s:x,e:x+1,key:k,a:occ[x]===-1?null:rb[occ[x]].a,n:occ[x]===-1?'':(rb[occ[x]].n||'').trim()};lin.push(cur)}}
  const segs=lin.map(x=>({...x}));
  if(segs.length>1&&segs[0].key===segs[segs.length-1].key){const f=segs.shift(),l=segs[segs.length-1];l.e=f.e+1440;l.wrap=true}
  segs.forEach(g=>{g.len=g.e-g.s;g.e=g.e%1440});
  segs.sort((a,b)=>a.s-b.s);
  const by={};let free=0;lin.forEach(g=>{const n=g.e-g.s;if(g.a)by[g.a]=(by[g.a]||0)+n;else free+=n});
  return {segs,lin,by,free,over,ovl};
}
const segTime=g=>g.len>=1440?tr('allDay'):fmtT(g.s)+' – '+fmtT(g.e);

function glanceHTML(){
  const lo=layout(st.rb),planned=1440-lo.free;
  const chips=ACK.filter(k=>lo.by[k]).map(k=>`<span class="badge" style="background:${AC[k].c}22;color:${AC[k].c}"><i class="dot" style="background:${AC[k].c}"></i>${actName(k)}: ${fmtD(lo.by[k])}</span>`).join(' ')
    +(lo.free?` <span class="badge b-warn">${tr('free')}: ${fmtD(lo.free)}</span>`:'');
  const bar=lo.lin.map(g=>`<i title="${esc(segTime({...g,len:g.e-g.s,e:g.e%1440}))} · ${g.a?actName(g.a):tr('free')}" style="width:${(g.e-g.s)/14.4}%;background:${g.a?AC[g.a].c:'transparent'}"></i>`).join('');
  const ticks=[0,360,720,1080].map(m=>`<span style="left:${m/14.4}%">${fmtT(m)}</span>`).join('');
  const list=lo.segs.map(g=>`<div class="gl ${g.a?'':'gap'}"><i class="dot" style="background:${g.a?AC[g.a].c:FREE_C}"></i><div><b>${g.a?actName(g.a):tr('free')}</b>${g.n?` <span class="gn">· ${esc(g.n)}</span>`:''}</div><div class="gt">${segTime(g)}<small>${fmtD(g.len%1440||1440)}${g.wrap||g.s+g.len>1440?' · '+tr('nextDay'):''}</small></div></div>`).join('');
  return `<h2 style="margin-top:22px">${tr('glance')}</h2>
   ${lo.over?`<div class="warnbox">⚠ ${tr('overlap',{h:fmtD(lo.over)})}</div>`:''}
   <div class="row" style="margin-bottom:10px">${chips}</div>
   <div class="bar24">${bar}</div><div class="ticks">${ticks}</div>
   <div class="gls">${list||`<div class="empty">${tr('empty')}</div>`}</div>
   <div class="note">${tr('planned',{h:fmtD(planned)})}</div>`;
}

function tick(){const T=tgt();if(!T||!$('cd-d'))return;const s=Math.floor(Math.max(0,T.d-Date.now())/1000),p=n=>nf(String(n).padStart(2,'0'));
  $('cd-d').textContent=nf(Math.floor(s/86400));$('cd-h').textContent=p(Math.floor(s%86400/3600));$('cd-m').textContent=p(Math.floor(s%3600/60));$('cd-s').textContent=p(s%60)}

  else if(h.startsWith('subject-')&&S.some(x=>x.id===h.slice(8))){st.view='subj';st.sub=h.slice(8)}
  else st.view='home'}

  const a=$('app');applyLang();

  a.innerHTML=header()+(st.view==='home'?home():st.view==='routine'?routineView():st.view==='print'?printView():subjView())+`<div class="foot">${sig()}</div>`;
  tick();
}
const keepScroll=f=>{const y=window.scrollY;f();window.scrollTo(0,y)};

/* ===== modal (works inside sandboxed pages where confirm/prompt are blocked) ===== */
function modal(html,onOk){
  const m=$('modal');m.innerHTML=`<div class="mbg" data-a="mno"></div><div class="mbox card">${html}</div>`;m.classList.add('on');modal.ok=onOk}
function closeModal(){const m=$('modal');m.classList.remove('on');m.innerHTML='';modal.ok=null}
function ask(msg,cb){modal(`<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="mno">${tr('cancel')}</button><button class="btn pri" data-a="mok">${tr('yes')}</button></div>`,cb)}

/* ===== events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;
  const a=t.dataset.a;
  if(a==='mno'){closeModal();return}
  if(a==='mok'){const f=modal.ok;closeModal();if(f)f();return}
  if(a==='lang'){if(st.lang!==t.dataset.l)setLang(t.dataset.l);return}
  if(a==='theme'){setTheme(curTheme()==='dark'?'light':'dark');return}
  if(a==='login'){const n=$('ln').value.trim(),b=$('li').value;if(!n){toast(tr('nameReq'));return}
    st.profile={name:n,batch:b};queueSave();render();return}
  if(a==='logout'){ask(tr('signoutAsk'),()=>{st.profile=null;st.p={};st.rb=defaultRoutine();st.rbd=true;lsSet();location.hash='';route();render()});return}
  if(a==='home'){if(st.view!=='home')location.hash='home';return}
  if(a==='routine'){location.hash='routine';return}
  if(a==='print'){location.hash='print';return}
  if(a==='doprint'){try{window.print()}catch(err){toast('Print is not available here')}return}
  if(a==='subj'){location.hash='subject-'+t.dataset.s;return}
  if(a==='tab'){history.replaceState(null,'','#subject-'+t.dataset.s);route();render();return}
  if(a==='share'){const u=location.href.split('#')[0];
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(tr('copied'))).catch(()=>{
      modal(`<p><b>${tr('copyTitle')}</b></p><input type="text" readonly value="${esc(u)}" id="cplink" style="margin:6px 0 12px"><div class="row" style="justify-content:flex-end"><button class="btn pri" data-a="mno">${tr('close')}</button></div>`);
      const c=$('cplink');if(c){c.focus();c.select()}});return}
  if(a==='badd'){
    const last=st.rb.length?st.rb.slice().sort((x,y)=>((x.s+((x.e-x.s+1440)%1440))%1440)-((y.s+((y.e-y.s+1440)%1440))%1440)).pop():null;
    const s=last?(last.s+((last.e-last.s+1440)%1440))%1440:540;
    st.rb.push({s,e:(s+60)%1440,a:'study',n:''});st.rbd=false;sortRb();queueSave();keepScroll(render);return}
  if(a==='bdel'){st.rb.splice(+t.dataset.i,1);st.rbd=false;queueSave();keepScroll(render);return}
  if(a==='rreset'){ask(tr('resetAsk'),()=>{st.rb=defaultRoutine();st.rbd=true;lsSet();keepScroll(render)});return}
});
document.addEventListener('change',e=>{
  const t=e.target;const a=t.dataset&&t.dataset.a;if(!a)return;
  if(['bs','be','ba','bn'].includes(a)){
    const b=st.rb[+t.dataset.i];if(!b)return;
    if(a==='bs'||a==='be'){const m=toMin(t.value);
      if(m===null){keepScroll(render);return}
      const ns=a==='bs'?m:b.s,ne=a==='be'?m:b.e;
      if(ns===ne){toast(tr('sameTime'));keepScroll(render);return}
      b.s=ns;b.e=ne;sortRb();st.rbd=false;queueSave();keepScroll(render);return}
    if(a==='ba')b.a=t.value;else b.n=t.value;
    st.rbd=false;queueSave();$('glance').innerHTML=glanceHTML();
    const row=t.closest('.rb');if(row&&a==='ba'){row.querySelector('.dot').style.background=AC[b.a].c}
    return}
  if(!['cov','mcq','cq'].includes(a))return;
  const sid=t.dataset.s,i=t.dataset.i;st.p[sid]=st.p[sid]||{};const c=st.p[sid][i]=st.p[sid][i]||{};
  if(a==='cov')c.s=+t.value;if(a==='mcq')c.m=t.checked;if(a==='cq')c.c=t.checked;
  queueSave();keepScroll(render);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ln'){const b=document.querySelector('[data-a=login]');if(b)b.click()}
  if(e.key==='Escape'&&$('modal').classList.contains('on'))closeModal()});
window.addEventListener('hashchange',()=>{route();render();window.scrollTo(0,0)});

(function init(){
  const l=lsGet();
  if(l){st.profile=l.profile;st.p=l.p||{};
    if(Array.isArray(l.rb)){st.rb=l.rb.filter(b=>b&&Number.isFinite(b.s)&&Number.isFinite(b.e)&&b.s!==b.e);st.rbd=false}
    else if(l.r&&Object.keys(l.r).length){st.rb=migrateOld(l.r);st.rbd=false}}
  if(!st.rb){st.rb=defaultRoutine();st.rbd=true}
  sortRb();applyTheme();applyLang();
  route();render();setInterval(tick,1000);
})();
</script>
